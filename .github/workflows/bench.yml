name: Bench

# Rust crates vs cb-mpc-ts bun:ffi vs cb-mpc-ts WASM on ubuntu-24.04 x64: same ops and runs,
# each backend as both 2P parties in one process, once on all CPUs and once pinned to one CPU
# (the kexify MPC host has 1 vCPU). Results in the job summary and as an artifact.
on:
  pull_request:
    paths:
      - "rust/interop/bench/**"
      - "rust/cbmpc/examples/**"
      - ".github/workflows/bench.yml"
  workflow_dispatch:
    inputs:
      runs_dkg:
        description: "DKG runs per backend"
        default: "20"
      runs_sign:
        description: "Sign runs per backend"
        default: "50"

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CBMPC_OPENSSL_ROOT: /usr/local/opt/openssl@3.6.4
      RUNS_DKG: ${{ inputs.runs_dkg || '20' }}
      RUNS_SIGN: ${{ inputs.runs_sign || '50' }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - name: Build static OpenSSL 3.6.4
        run: |
          sudo mkdir -p /usr/local/opt
          sudo -E bash scripts/openssl/build-static-openssl-linux.sh
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Bench deps
        run: |
          npm install -g bun@1.3.10
          cd rust/interop && bun install --frozen-lockfile
      - name: Bench (all CPUs)
        run: |
          { echo "## All CPUs ($(nproc), $(lscpu | sed -n 's/^Model name: *//p'))"; echo
            bash rust/interop/bench/run-bench.sh "$RUNS_DKG" "$RUNS_SIGN"; } | tee bench-all.md
          cat bench-all.md >> "$GITHUB_STEP_SUMMARY"
      - name: Bench (pinned to 1 CPU, like the 1-vCPU MPC host)
        run: |
          { echo; echo "## Pinned to CPU 0"; echo
            bash rust/interop/bench/run-bench.sh "$RUNS_DKG" "$RUNS_SIGN" 0; } | tee bench-1cpu.md
          cat bench-1cpu.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench
          path: bench-*.md
