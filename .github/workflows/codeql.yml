name: "CodeQL - Custom"

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    paths:
      - '**/*.cpp'
      - '**/*.h'
      - '**/*.hpp'
      - '**/*.c'
      - '**/*.py'
      - '.github/workflows/codeql.yml'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'cpp', 'python' ]

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
      with:
        egress-policy: audit

    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        ref: ${{ github.event.inputs.branch }}

    - name: Initialize CodeQL
      uses: github/codeql-action/init@fca7ace96b7d713c7035871441bd52efbe39e27e # v3.28.19
      with:
        languages: ${{ matrix.language }}
        queries: security-and-quality

    - name: Install language dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake

    - if: matrix.language == 'python'
      name: Autobuild
      uses: github/codeql-action/autobuild@fca7ace96b7d713c7035871441bd52efbe39e27e # v3.28.19
    - if: matrix.language == 'cpp'
      name: Build project
      run: |
        sudo mkdir -p /usr/local/opt
        sudo mkdir -p /usr/local/lib64
        sudo chmod 777 -R /usr/local/opt
        sudo chmod 777 -R /usr/local/lib64
        make

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@fca7ace96b7d713c7035871441bd52efbe39e27e # v3.28.19
      with:
        category: "/language:${{matrix.language}}"
        output: sarif-results
        upload: false

    # gtest's TEST/TYPED_TEST macros define a static `gtest_<Suite>_<Test>_registered_` (or `_dummy_`) whose
    # initializer registers the test; it is never read by design. Drop only those unused-static-variable results.
    - name: Filter gtest registration false positives
      run: |
        python3 - <<'PY'
        import glob, json, re
        gtest = re.compile(r"Static variable gtest_\w+_ is never read")
        for path in glob.glob("sarif-results/*.sarif"):
            with open(path) as f:
                sarif = json.load(f)
            for run in sarif.get("runs", []):
                before = len(run.get("results", []))
                run["results"] = [
                    r for r in run.get("results", [])
                    if not (r.get("ruleId") == "cpp/unused-static-variable"
                            and gtest.search(r.get("message", {}).get("text", "")))
                ]
                print(f"{path}: dropped {before - len(run['results'])} gtest registration results")
            with open(path, "w") as f:
                json.dump(sarif, f)
        PY

    - name: Upload CodeQL results
      uses: github/codeql-action/upload-sarif@fca7ace96b7d713c7035871441bd52efbe39e27e # v3.28.19
      with:
        sarif_file: sarif-results
        category: "/language:${{matrix.language}}"
