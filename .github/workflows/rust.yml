name: Rust

# Build and test the Rust crates in rust/ (cbmpc-sys, cbmpc) on Linux x86_64 and macOS arm64:
# static cb-mpc + OpenSSL 3.6.4, in-process 2P tests, interop with the released cb-mpc-ts
# (rust/interop, npm), and on Linux the MemoryDenyWriteExecute smoke test.
on:
  push:
    branches: [master]
    paths:
      - "rust/**"
      - "src/**"
      - "include/**"
      - "include-internal/**"
      - "cb-mpc-ts/capi/**"
      - "cb-mpc-ts/binding.cpp"
      - "cb-mpc-ts/native/**"
      - "cmake/**"
      - "scripts/openssl/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "rust/**"
      - "src/**"
      - "include/**"
      - "include-internal/**"
      - "cb-mpc-ts/capi/**"
      - "cb-mpc-ts/binding.cpp"
      - "cb-mpc-ts/native/**"
      - "cmake/**"
      - "scripts/openssl/**"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.98.0"
  CBMPC_OPENSSL_ROOT: /usr/local/opt/openssl@3.6.4

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            openssl_script: scripts/openssl/build-static-openssl-linux.sh
          - os: macos-14
            openssl_script: scripts/openssl/build-static-openssl-macos-m1.sh
    runs-on: ${{ matrix.os }}
    name: Rust ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Build static OpenSSL 3.6.4
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          sudo mkdir -p /usr/local/opt
          sudo -E bash ${{ matrix.openssl_script }}

      - name: Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_TOOLCHAIN"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Interop client deps (bun + npm cb-mpc-ts)
        run: |
          npm install -g bun@1.3.10
          cd rust/interop && bun install --frozen-lockfile

      - name: Format and lint
        working-directory: rust
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        working-directory: rust
        env:
          CBMPC_FROM_SOURCE: "1"
          CBMPC_REQUIRE_INTEROP: "1"
          CBMPC_REQUIRE_MDWE: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: cargo test --locked

      # Once prebuilt.rs pins a release: every pinned asset must match its pin and carry this repo's
      # build provenance, and the default build (download + sha256 check, no C++ compile) must pass.
      - name: Check pinned prebuilt artifacts
        id: pinned
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/native-artifacts/check-pinned-prebuilt.sh rust/cbmpc-sys/prebuilt.rs

      - name: Test the default (pinned prebuilt) build
        if: steps.pinned.outputs.pinned == 'true'
        working-directory: rust
        env:
          CBMPC_REQUIRE_INTEROP: "1"
          CBMPC_REQUIRE_MDWE: ${{ runner.os == 'Linux' && '1' || '0' }}
          # No usable OpenSSL: a silent fallback to the source build fails instead of passing.
          CBMPC_OPENSSL_ROOT: /nonexistent
        run: |
          cargo clean -p cbmpc-sys
          cargo test --locked
