name: Native release artifacts

# Builds the native cb-mpc libraries ONCE per platform, so consumers (rust/cbmpc-sys, the kexify
# server and iOS app) never compile cb-mpc C++ themselves:
#   cbmpc-native-linux-x64.tar.gz    libcbmpc.a + libcrypto.a + headers (manylinux_2_28, glibc >= 2.28)
#   cbmpc-native-darwin-arm64.tar.gz same for macOS arm64 (11.0+)
#   cbmpc-native-ios.xcframework.zip CbMpc.xcframework (device arm64 + simulator arm64, OpenSSL folded in)
# Each linux/macOS artifact is verified by running the Rust crates' tests against it (incl. the
# cb-mpc-ts interop test and, on Linux, MemoryDenyWriteExecute). Then SHA256SUMS + build provenance
# attestations; on a v* tag the files are uploaded to that tag's GitHub Release (a draft is created
# if none exists, for a maintainer to publish). Pull requests touching the build and
# workflow_dispatch are dry runs: artifacts on the run only, no attestation, no release.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "scripts/native-artifacts/**"
      - "scripts/openssl/**"
      - "cb-mpc-ts/native/**"
      - "rust/cbmpc-sys/**"
      - ".github/workflows/native-release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x64:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - name: Build in manylinux_2_28
        run: |
          docker run --rm -v "$PWD":/src -w /src -e GITHUB_REF_NAME quay.io/pypa/manylinux_2_28_x86_64 bash -euo pipefail -c '
            dnf install -y -q perl >/dev/null
            git config --global --add safe.directory /src
            bash scripts/native-artifacts/build-native-static.sh linux-x64 dist
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-linux-x64
          path: dist/cbmpc-native-linux-x64.tar.gz

  darwin-arm64:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - run: bash scripts/native-artifacts/build-native-static.sh darwin-arm64 dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-darwin-arm64
          path: dist/cbmpc-native-darwin-arm64.tar.gz

  ios:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - run: bash scripts/native-artifacts/build-ios-xcframework.sh dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-ios
          path: dist/cbmpc-native-ios.xcframework.zip

  # The artifacts must link and pass the Rust tests exactly as consumers will use them.
  verify:
    needs: [linux-x64, darwin-arm64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: macos-14
            platform: darwin-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: native-${{ matrix.platform }}
          path: dist
      - run: mkdir -p native && tar -xzf dist/cbmpc-native-${{ matrix.platform }}.tar.gz -C native
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Interop client deps
        run: |
          npm install -g bun@1.3.10
          cd rust/interop && bun install --frozen-lockfile
      - name: Test against the artifact (no C++ compile)
        working-directory: rust
        env:
          CBMPC_NATIVE_DIR: ${{ github.workspace }}/native/cbmpc-native-${{ matrix.platform }}
          CBMPC_REQUIRE_INTEROP: "1"
          CBMPC_REQUIRE_MDWE: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: cargo test --locked

  publish:
    needs: [verify, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum cbmpc-native-* > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          subject-path: dist/cbmpc-native-*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-release
          path: dist/
      - name: Upload to the tag's release (draft if new)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
                 --title "$TAG" --notes "Native artifacts for $TAG (see SHA256SUMS; verify with gh attestation verify)."
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/cbmpc-native-* dist/SHA256SUMS
