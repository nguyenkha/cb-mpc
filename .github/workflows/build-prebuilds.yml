name: Build Native Prebuilds

on:
  push:
    branches: [master]
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
    paths:
      - "cb-mpc-ts/**"
      - "src/**"
      - "include/**"
      - "include-internal/**"
      - "cmake/**"
      - "scripts/openssl/**"
      - ".github/workflows/build-prebuilds.yml"
  pull_request:
    paths:
      - "cb-mpc-ts/**"
      - "src/**"
      - "include/**"
      - "include-internal/**"
      - "cmake/**"
      - "scripts/openssl/**"
      - ".github/workflows/build-prebuilds.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-native:
    strategy:
      matrix:
        include:
          # Linux libraries are built in manylinux_2_28 (glibc 2.28) by
          # cb-mpc-ts/scripts/build-linux-prebuild.sh so they load on older distros.
          - os: ubuntu-latest
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-14
            platform: darwin-arm64
            openssl_script: scripts/openssl/build-static-openssl-macos-m1.sh

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.platform }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Build native shared library (Linux, manylinux_2_28 container)
        if: runner.os == 'Linux'
        run: bash cb-mpc-ts/scripts/build-linux-prebuild.sh

      - name: Build OpenSSL (macOS)
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          sudo mkdir -p /usr/local/opt
          sudo -E bash ${{ matrix.openssl_script }}

      - name: Build native shared library (macOS)
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cmake -B build/native -S cb-mpc-ts/native \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_OSX_ARCHITECTURES=$(uname -m) \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build/native -- -j$(sysctl -n hw.ncpu)

      - name: Verify output
        run: |
          ls -lh cb-mpc-ts/prebuilds/${{ matrix.platform }}/
          file cb-mpc-ts/prebuilds/${{ matrix.platform }}/libcbmpc.*
          if [ "${{ runner.os }}" = "Linux" ]; then
            bash cb-mpc-ts/scripts/check-linux-prebuild.sh cb-mpc-ts/prebuilds/${{ matrix.platform }}/libcbmpc.so
          else
            otool -l cb-mpc-ts/prebuilds/${{ matrix.platform }}/libcbmpc.dylib | grep -A3 LC_BUILD_VERSION
          fi

      - name: Upload prebuild artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prebuild-${{ matrix.platform }}
          path: cb-mpc-ts/prebuilds/${{ matrix.platform }}/
          retention-days: 90

  build-wasm:
    runs-on: ubuntu-latest
    name: Build WASM

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14
        with:
          version: 3.1.51

      - name: Build OpenSSL for WASM
        run: |
          sudo mkdir -p /usr/local/opt/openssl@3.6.4-wasm
          sudo chmod 777 /usr/local/opt/openssl@3.6.4-wasm
          bash scripts/openssl/build-static-openssl-wasm.sh

      - name: Build WASM
        run: make build-wasm

      - name: Upload WASM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wasm-build
          path: |
            cb-mpc-ts/cbmpc.js
            cb-mpc-ts/cbmpc.wasm
          retention-days: 90

  build-typescript:
    runs-on: ubuntu-latest
    name: Build TypeScript
    needs: [build-native, build-wasm]

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Assemble package
        run: |
          # Copy WASM build
          cp artifacts/wasm-build/cbmpc.js cb-mpc-ts/cbmpc.js
          cp artifacts/wasm-build/cbmpc.wasm cb-mpc-ts/cbmpc.wasm

          # Copy prebuilds
          mkdir -p cb-mpc-ts/prebuilds
          for dir in artifacts/prebuild-*/; do
            platform=$(basename "$dir" | sed 's/prebuild-//')
            mkdir -p "cb-mpc-ts/prebuilds/$platform"
            cp "$dir"/* "cb-mpc-ts/prebuilds/$platform/"
          done

          # Build TypeScript
          cd cb-mpc-ts
          npm install
          npm run build

          # HD keyset tests on the built WASM package. They include the drift guard for
          # capi/hd_keyset.inc's copy of upstream's hardened derivation step.
          npm run test:hd

          # Show package contents
          echo "=== Package contents ==="
          find dist/ prebuilds/ cbmpc.js cbmpc.wasm -type f | head -20
          echo "=== Sizes ==="
          du -sh dist/ prebuilds/ cbmpc.js cbmpc.wasm

      - name: Upload full package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cb-mpc-package
          path: |
            cb-mpc-ts/dist/
            cb-mpc-ts/prebuilds/
            cb-mpc-ts/cbmpc.js
            cb-mpc-ts/cbmpc.wasm
            cb-mpc-ts/package.json
            cb-mpc-ts/README.md
            cb-mpc-ts/LICENSE
          retention-days: 90

  smoke-linux:
    # Load the packaged Linux libraries on older distros through koffi and
    # compare results with the WASM build (catches glibc / libstdc++ drift).
    needs: [build-typescript]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            image: node:22-bullseye
          - os: ubuntu-latest
            image: node:22-bookworm
          - os: ubuntu-24.04-arm
            image: node:22-bookworm
    runs-on: ${{ matrix.os }}
    name: Smoke ${{ matrix.image }} (${{ matrix.os }})
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download package artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cb-mpc-package
          path: pkg

      - name: Load native library in ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD/pkg":/pkg -v "$PWD/cb-mpc-ts/scripts":/scripts -w /pkg ${{ matrix.image }} \
            bash -c 'npm install --no-save --no-audit --no-fund koffi debug >/dev/null && node /scripts/native-smoke.mjs /pkg'

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    name: Publish to npm
    needs: [build-typescript, smoke-linux]
    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Download package artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cb-mpc-package
          path: cb-mpc-ts

      - name: Publish to npm
        working-directory: cb-mpc-ts
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
