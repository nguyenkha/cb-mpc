[package]
name = "cbmpc-sys"
description = "Raw FFI to cb-mpc through the cb-mpc-ts C ABI, statically linked with OpenSSL"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
links = "cbmpc"
build = "build.rs"
# Consumed as a git dependency of this repo: the source build needs the whole checkout.
publish = false

[build-dependencies]
cmake = "0.1.54"
sha2 = "0.10"
